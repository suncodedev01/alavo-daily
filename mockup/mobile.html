<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Manager — Mobile</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/palettes.css">
<script src="assets/palettes.js"></script>
<style>
  body { min-height: 100vh; padding: 24px 24px 64px; }
  .page-head { max-width: 1400px; margin: 0 auto 24px; display: flex; align-items: center; gap: 16px; }
  .page-head h1 { font-size: 24px; font-weight: 600; margin-right: auto; }
  .page-head p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .stage { max-width: 1400px; margin: 0 auto; display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
  figure { display: grid; gap: 12px; justify-items: center; }
  figcaption { font-size: 13px; font-weight: 500; color: var(--text-secondary); }

  .phone { position: relative; width: 390px; height: 844px; border-radius: 52px; background: var(--paper); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 10px var(--click-900), 0 0 0 11px var(--line-strong), var(--elevation-overlay); }
  :root[data-theme="dark"] .phone { box-shadow: 0 0 0 10px #0F0C06, 0 0 0 11px var(--line-strong), var(--elevation-overlay); }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; border-radius: 20px; background: #0F0C06; transform: translateX(-50%); z-index: 5; }
  .status { height: 54px; flex: none; padding: 18px 32px 0 36px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 16px 24px; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; gap: 16px; align-content: start; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .tabbar { flex: none; height: 84px; padding: 8px 8px 0; background: var(--surface); box-shadow: 0 -1px 0 var(--line-hairline); display: grid; grid-template-columns: repeat(5, 1fr); align-items: start; position: relative; }
  .tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--text-muted); min-height: 48px; }
  .tab .ic { width: 24px; height: 24px; }
  .tab.on { color: var(--accent-fg); }
  .tab.on span.pillbg { background: var(--accent); }
  .tab .pillbg { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
  .fab { width: 52px; height: 52px; border-radius: 26px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; margin: -2px auto 0; box-shadow: var(--elevation-raised); }
  .fab .ic { width: 24px; height: 24px; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 3px; background: var(--text-primary); transform: translateX(-50%); }

  .top { display: flex; align-items: center; gap: 12px; padding: 4px 4px 0; }
  .top .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .iconbtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: var(--surface); box-shadow: 0 0 0 1px var(--line-hairline), var(--elevation-hairline); }
  .iconbtn .ic { width: 20px; height: 20px; }
  .p5 { padding: 24px; }
  .p4 { padding: 16px; }
  .rowbtn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 0; text-align: left; }
  .rowbtn + .rowbtn { box-shadow: 0 -1px 0 var(--line-hairline); }
  .rowbtn.card { padding: 8px 16px; }
  .rt { display: block; font-size: 16px; font-weight: 500; }
  .rs { display: block; font-size: 13px; color: var(--text-muted); }
  .ra { font-size: 16px; font-weight: 500; white-space: nowrap; }
  .sec-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .link { color: var(--accent-fg); font-size: 14px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; }
  .field { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: var(--r-4xl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hairline); color: var(--text-muted); font-size: 16px; }
  .pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { height: 36px; padding: 0 16px; font-size: 14px; flex: none; }
  .meter { height: 8px; }
  .bline { display: grid; gap: 8px; padding: 12px 0; }
  .bline + .bline { box-shadow: 0 -1px 0 var(--line-hairline); }
  .day-label { padding: 4px 4px 0; }

  /* add sheet */
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: var(--r-4xl); background: var(--surface-tint); margin: 0 16px; }
  .seg button { height: 40px; border-radius: var(--r-4xl); font-size: 15px; font-weight: 500; color: var(--text-secondary); }
  .seg button.on { background: var(--surface); color: var(--text-primary); box-shadow: var(--elevation-raised); }
  .amount { text-align: center; padding: 16px 0 8px; }
  .amount .t-display { font-size: 38px; }
  .chipset { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
  .chipset::-webkit-scrollbar { display: none; }
  .chipset::after { content: ''; flex: none; width: 1px; }
  .catpill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px; border-radius: var(--r-4xl); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hairline); font-size: 14px; font-weight: 500; color: var(--text-secondary); flex: none; }
  .catpill.on { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 16px; }
  .key { height: 52px; border-radius: var(--r-xl); font-size: 24px; font-weight: 500; display: grid; place-items: center; }
  .key:active { background: var(--surface-tint); }
  .key .ic { width: 24px; height: 24px; }
  .save { margin: 0 16px; height: 52px; border-radius: var(--r-4xl); background: var(--primary); color: var(--primary-fg); font-size: 16px; font-weight: 600; box-shadow: var(--elevation-raised); }
  .save:hover { background: var(--primary-hover); }
  .sheet { flex: 1; display: grid; align-content: start; gap: 12px; padding-bottom: 28px; }
  .catpill.add { color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--line-strong); background: transparent; }
  .overlay { position: absolute; inset: 0; z-index: 6; background: var(--scrim); display: flex; align-items: flex-end; }
  .overlay[hidden] { display: none; }
  .ov-sheet { width: 100%; background: var(--surface); border-radius: 28px 28px 0 0; padding: 12px 16px 36px; display: grid; gap: 16px; box-shadow: var(--elevation-overlay); }
  .ov-sheet.fixed { max-height: 92%; display: flex; flex-direction: column; gap: 0; padding: 12px 0 0; }
  .ov-head { display: grid; gap: 12px; padding: 0 16px 12px; flex: none; }
  .ov-body { overflow-y: auto; min-height: 0; display: grid; gap: 16px; padding: 4px 16px 24px; align-content: start; }
  .ov-foot .save { width: 100%; }
  .ov-foot { flex: none; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 20px)); box-shadow: 0 -1px 0 var(--line-hairline); background: var(--surface); }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--line-strong); justify-self: center; }
  .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .icon-opt { height: 48px; border-radius: var(--r-xl); display: grid; place-items: center; color: var(--text-secondary); }
  .icon-opt.on { background: var(--accent); color: var(--accent-fg); }
  .icon-opt .ic { width: 22px; height: 22px; }
  .field input { border: 0; background: none; outline: 0; flex: 1; min-width: 0; color: var(--text-primary); font-size: 16px; }
  .switch { width: 51px; height: 31px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: var(--elevation-raised); }
  .switch[aria-checked="true"] { background: var(--primary); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .hero-tile { width: 48px; height: 48px; border-radius: var(--r-xl); background: var(--surface-tint); color: var(--text-secondary); display: grid; place-items: center; flex: none; }
  .hero-tile .ic { width: 24px; height: 24px; }
  .checks { display: grid; gap: 12px; }
  .checks li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--text-secondary); }
  .checks .ic { margin-top: 3px; color: var(--text-muted); }
  .stat4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat4 > div { background: var(--surface-tint); border-radius: var(--r-lg); padding: 12px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; min-height: 64px; padding: 16px; border-radius: var(--r-xl); text-align: left; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hairline); }
  .opt[aria-checked="true"] { background: var(--accent); box-shadow: none; }
  .opt .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-strong); flex: none; margin-top: 1px; display: grid; place-items: center; }
  .opt[aria-checked="true"] .radio { box-shadow: inset 0 0 0 2px var(--accent-fg); }
  .opt[aria-checked="true"] .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-fg); }
  .vs { display: grid; gap: 8px; }
  .vs > div { background: var(--surface-tint); border-radius: var(--r-lg); padding: 12px; display: grid; gap: 2px; }
  .navhead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; height: 44px; flex: none; }
  .navhead .back { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent-fg); font-size: 16px; }
  .navhead .back .ic { width: 22px; height: 22px; }
  .sw-row { display: flex; align-items: center; gap: 12px; min-height: 64px; }
  .sw-row + .sw-row { box-shadow: 0 -1px 0 var(--line-hairline); }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .modpill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 6px; border-radius: 22px; background: var(--surface); box-shadow: 0 0 0 1px var(--line-hairline), var(--elevation-hairline); font-size: 15px; font-weight: 600; }
  .modpill .tile { width: 32px; height: 32px; border-radius: 16px; background-color: var(--tile-bg, var(--primary)); color: var(--tile-fg, var(--primary-fg)); display: grid; place-items: center; }
  .modpill .tile .ic { width: 18px; height: 18px; }
  .iconbtn { position: relative; }
  .udot { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 2px var(--surface); }
  .dish { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 0; text-align: left; }
  .dish + .dish { box-shadow: 0 -1px 0 var(--line-hairline); }
  .dish .rt { font-size: 16px; font-weight: 500; display: block; }
  .dish .rs { font-size: 13px; color: var(--text-muted); display: block; }
  .rcard { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 8px 12px 8px 8px; border-radius: var(--r-xl); background: var(--surface); box-shadow: 0 0 0 1px var(--line-hairline), var(--elevation-hairline); text-align: left; }
  .rcard .thumb { width: 56px; height: 56px; border-radius: var(--r-lg); background: var(--surface-brand); color: var(--click-700); display: grid; place-items: center; flex: none; }
  :root[data-theme="dark"] .rcard .thumb, :root[data-theme="dark"] .cover-m { color: var(--click-300); }
  .rcard .thumb .ic { width: 28px; height: 28px; }
  .cover-m { height: 190px; border-radius: 0 0 28px 28px; background: var(--surface-brand); color: var(--click-700); display: grid; place-items: center; position: relative; margin: 0 -16px; }
  .cover-m > .ic { width: 72px; height: 72px; }
  .cover-m .iconbtn { position: absolute; top: 12px; }
  .stepper { display: inline-flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-strong); }
  .stepper b { min-width: 36px; text-align: center; font-size: 18px; font-weight: 600; }
  .mchips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mchips > div { background: var(--surface-tint); border-radius: var(--r-lg); padding: 12px; }
  .check { width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--line-strong); display: grid; place-items: center; flex: none; color: var(--primary-fg); }
  .check .ic { width: 16px; height: 16px; opacity: 0; }
  .shop-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 0; text-align: left; }
  .shop-row + .shop-row { box-shadow: 0 -1px 0 var(--line-hairline); }
  .shop-row[aria-checked="true"] .check { background: var(--primary); box-shadow: none; }
  .shop-row[aria-checked="true"] .check .ic { opacity: 1; }
  .shop-row[aria-checked="true"] .sn { color: var(--text-muted); text-decoration: line-through; }
  .sn { display: block; font-size: 16px; font-weight: 500; }
  .sf { display: block; font-size: 13px; color: var(--text-muted); }
  .shop-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); box-shadow: 0 -1px 0 var(--line-hairline); }
  .daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .daystrip button { display: grid; justify-items: center; gap: 2px; padding: 8px 0; border-radius: var(--r-xl); font-size: 12px; color: var(--text-muted); min-height: 56px; }
  .daystrip button b { font-size: 16px; color: var(--text-primary); }
  .daystrip button.on { background: var(--accent); color: var(--accent-fg); }
  .daystrip button.on b { color: var(--accent-fg); }
  .daystrip button.today b::after { content: ''; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); margin: 2px auto 0; }
  .nrow { display: flex; gap: 12px; padding: 12px; border-radius: var(--r-xl); }
  .nrow.unread { background: var(--accent); }
  .nrow .nt { font-size: 15px; font-weight: 500; }
  .nrow .nb { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .nrow.unread .nb { color: var(--text-secondary); }
  .nrow .nm { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .btn, .btn.sm { height: 44px; }
  .btn.icon { width: 44px; padding: 0; }
  .pill { min-height: 44px; }
  .switch::before { content: ''; position: absolute; inset: -7px -4px; }
  .pop button { min-height: 44px; }
  .row:has(> h1) { flex-wrap: wrap; row-gap: 8px; }
  .rule-m { display: grid; gap: 8px; padding: 12px 0; }
  .rule-m + .rule-m { box-shadow: 0 -1px 0 var(--line-hairline); }
  .rule-top { display: flex; align-items: center; gap: 12px; }
  .time-field { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 16px; border-radius: var(--r-4xl); background: var(--surface-tint); font-size: 15px; font-weight: 500; }
  .allow-card { display: grid; gap: 12px; }
  .range-stack { display: grid; gap: 8px; }
  .phone.kb-open .tabbar { display: none; }
  .lockscreen { background: linear-gradient(165deg, var(--wallpaper-a), var(--wallpaper-b) 55%, var(--wallpaper-c)); color: var(--on-wallpaper); }
  .lock-head { display: grid; justify-items: center; gap: 4px; margin-top: 8px; }
  .lock-date { font-size: 18px; font-weight: 500; }
  .lock-clock { font-size: 88px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; }
  .lock-list { display: grid; gap: 8px; padding: 36px 12px 0; }
  .os-notif { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 22px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(18px); color: var(--text-primary); box-shadow: var(--elevation-card); }
  .os-notif .cat-tile { width: 40px; height: 40px; }
  .os-top { display: flex; gap: 8px; font-size: 12px; color: var(--text-secondary); }
  .os-title { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .os-body { font-size: 14px; line-height: 1.35; color: var(--text-secondary); margin-top: 2px; }
  .os-acts { grid-column: 2; display: flex; gap: 8px; margin-top: 4px; }
  .os-acts .btn { height: 40px; padding: 0 14px; }
  .os-banner { position: absolute; top: 58px; left: 12px; right: 12px; z-index: 6; }
  .tabs2 { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: var(--r-4xl); background: var(--surface-tint); }
  .tabs2 button { height: 40px; border-radius: var(--r-4xl); font-size: 15px; font-weight: 500; color: var(--text-secondary); }
  .tabs2 button.on { background: var(--surface); color: var(--text-primary); box-shadow: var(--elevation-raised); }
  .modrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px; border-radius: var(--r-xl); text-align: left; }
  .modrow.on { background: var(--accent); }
  .modrow .tile { width: 44px; height: 44px; border-radius: var(--r-lg); background-color: var(--tile-bg, var(--surface-tint)); color: var(--tile-fg, inherit); display: grid; place-items: center; flex: none; }
  .cook-m { background: var(--paper); }
  .cook-big { font-size: 26px; line-height: 1.35; font-weight: 500; }
  .tbox { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--r-2xl); background: var(--surface); box-shadow: 0 0 0 1px var(--line-hairline), var(--elevation-card); }
  .gtitle { max-width: 1400px; margin: 40px auto 16px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
  .time-pill { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border-radius: var(--r-4xl); background: var(--surface-tint); font-size: 14px; font-weight: 500; }
  .tab.center { margin-top: -14px; gap: 2px; padding: 0; }
  .tab.center .fab { margin: 0 auto; }
  .tab.center.on { color: var(--accent-fg); }
  .tab.center.on .fab { box-shadow: 0 0 0 4px var(--accent), var(--elevation-raised); }
  .area { width: 100%; min-height: 88px; padding: 12px 16px; border-radius: var(--r-xl); border: 0; outline: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-hairline); color: var(--text-primary); font: inherit; font-size: 16px; resize: none; }
  .area:focus { box-shadow: inset 0 0 0 2px var(--ring); }
  .dropzone { display: flex; gap: 12px; align-items: center; width: 100%; padding: 16px; border-radius: var(--r-xl); border: 1px dashed var(--line-strong); text-align: left; min-height: 72px; }
  .eing { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-xl); background: var(--surface-tint); }
  .estep { display: grid; gap: 8px; }
  .estep + .estep { box-shadow: 0 -1px 0 var(--line-hairline); padding-top: 16px; }
  .field.pick { cursor: pointer; }
  .donut-wrap { display: grid; place-items: center; position: relative; }
  .donut-center { position: absolute; text-align: center; }
</style>
</head>
<body>
<header class="page-head">
  <div><h1>Alavo Daily — Mobile</h1><p>390 × 844 · bấm được: bàn phím nhập tiền, kết nối Google, chi tiết công thức, chế độ nấu ăn, thực đơn tuần, đi chợ</p></div>
  <button class="btn outline" id="themeBtn"><span data-i="moon"></span>Sáng / Tối</button>
</header>
<div id="groups"></div>

<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/food-data.js"></script>
<script src="assets/dialogs.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const meter = (pct) => `<div class="meter ${meterTone(pct)}" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(pct, 1) * 100}%"></i></div>`;
const daysLeft = 31 - TODAY;
const food = BUDGETED.find((b) => b.id === 'food');

const row = (t) => `<button class="rowbtn" type="button"><span class="cat-tile">${ic(CATS[t.cat].icon)}</span><span class="grow"><span class="rt trunc">${t.title}</span><span class="rs trunc">${CATS[t.cat].name} · ${walletName(t.wallet)}</span></span><span class="ra ${amountTone(t.amt)}">${signed(t.amt)}</span></button>`;

const phone = (caption, body, tab, { bar = true, tabs = 'spend' } = {}) => `
  <figure><div class="phone"><div class="island"></div>
    <div class="status"><span>9:41</span><span class="r" style="font-size:14px">5G &nbsp;100%</span></div>
    ${body}
    ${bar ? (tabs === 'food' ? tabbarFood(tab) : tabs === 'home' ? tabbarHome(tab) : tabbar(tab)) : ''}<div class="home-ind"></div></div><figcaption>${caption}</figcaption></figure>`;

const tabbar = (on) => {
  const t = (id, icon, label) => `<button class="tab ${on === id ? 'on' : ''}" type="button"><span class="pillbg">${ic(icon)}</span>${label}</button>`;

  return `<div class="donut-wrap"><svg width="188" height="188" viewBox="0 0 188 188" role="img" aria-label="Đã dùng ${pctText(p)} ngân sách"><circle cx="94" cy="94" r="${r}" fill="none" stroke="var(--surface-tint)" stroke-width="16"/><circle cx="94" cy="94" r="${r}" fill="none" stroke="var(--chart-1)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 94 94)"/></svg>

};

const shopState = buildShopping();
const shopNeedM = () => shopState.filter((i) => !i.have);
const shopCostM = () => shopNeedM().reduce((s, i) => s + i.c, 0);

  const b = foodB(), cost = shopCostM(), proj = b.spent + cost, over = proj - b.budget;
  if (over <= 0) return '';
  const roundUp = Math.ceil(over / 100) * 100;
  return `<section class="card p4"><div class="row" style="gap:8px;margin-bottom:8px"><span class="t-base w6 grow">Cần bạn quyết định</span><span class="chip needs">Cần bạn</span></div>

    <div class="row" style="gap:8px;margin-top:16px"><button class="btn primary grow" style="height:44px">Tăng thêm ${vnd(roundUp)}</button><button class="btn outline" style="height:44px">Giữ nguyên</button></div></section>`;
};

  $('#ncClose').onclick = () => { $('#newCat').hidden = true; };
  $('#newCatForm').onsubmit = (e) => { e.preventDefault(); cat = addCategory({ name: $('#ncName').value.trim(), icon: ncIcon, budget: +$('#ncBudget').value.replace(/\D/g, '') / 1000, kind }); $('#newCat').hidden = true; paint(); $('#cats').lastElementChild.previousElementSibling?.scrollIntoView({ inline: 'center', block: 'nearest' }); };
  $('#sheet .seg').onclick = (e) => { const b = e.target.closest('[data-kind]'); if (!b) return; kind = b.dataset.kind; cat = kind === 'in' ? 'income' : 'food'; $('#sheet .seg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); paint(); };
  save.onclick = () => { save.textContent = 'Đã lưu ✓'; setTimeout(() => { digits = ''; paint(); }, 1200); };
  paint();
})();


/* sync phone behaviour */
(() => {
  const body = $('#syncBody');
  let timer;
  const toOff = () => { clearTimeout(timer); body.innerHTML = syncOffBody(); hydrateIcons(body); };
  const toConnected = () => { body.innerHTML = syncOnBody(); hydrateIcons(body); };
  body.onclick = (e) => {
    const a = e.target.closest('[data-act]')?.dataset.act; if (!a) return;
    if (a === 'connect') { body.innerHTML = syncConnectingBody(); timer = setTimeout(toConnected, 2200); }
    else if (a === 'cancel') toOff();
    else if (a === 'ask-disconnect') toOff();
  };
  const ov = $('#discOverlay');
  document.querySelectorAll('[data-act="ask-disconnect"]').forEach((b) => { if (!body.contains(b)) b.onclick = () => { ov.hidden = false; }; });
  $('#discCancel').onclick = () => { ov.hidden = true; };
  $('#discOk').onclick = () => { ov.hidden = true; };
  document.querySelectorAll('#choices').forEach((g) => { g.onclick = (e) => { const o = e.target.closest('[data-choice]'); if (!o) return; g.querySelectorAll('[data-choice]').forEach((x) => x.setAttribute('aria-checked', x === o)); }; });
})();

bindFood();
['a', 'b', 'c'].forEach(bindEditor);
$('#ed-c').scrollTop = 99999;
$('#themeBtn').onclick = () => setThemeMode(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
document.addEventListener('focusin', (e) => { const frame = e.target.closest('.phone'); if (frame && e.target.matches('input, textarea')) { frame.classList.add('kb-open'); e.target.scrollIntoView({ block: 'center' }); } });
document.addEventListener('focusout', (e) => { const frame = e.target.closest('.phone'); if (frame) frame.classList.remove('kb-open'); });
</script>
</body>
