[package]
name = "alavo-presentation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alavo-domain = { path = "../domain" }
alavo-application = { path = "../application" }
alavo-infrastructure = { path = "../infrastructure" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
alavo-infrastructure = { path = "../infrastructure", features = ["native"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-nontrapping-float-to-int", "--enable-bulk-memory", "--enable-sign-ext"]
