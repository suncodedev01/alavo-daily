name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test --manifest-path packages/engine/Cargo.toml
      - run: pnpm -r --no-bail typecheck
      - run: pnpm -r --no-bail --workspace-concurrency=1 test
      - run: pnpm test:scripts
