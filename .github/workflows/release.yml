name: Release

run-name: Release (${{ inputs.bump }} bump)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump level
        type: choice
        options: [patch, minor, major]
        default: patch
      build_web:
        description: Build web (zip)
        type: boolean
        default: true
      build_windows:
        description: Build Windows desktop
        type: boolean
        default: true
      build_macos:
        description: Build macOS desktop (universal)
        type: boolean
        default: false
      build_linux:
        description: Build Linux desktop
        type: boolean
        default: false
      build_android:
        description: Build Android (APK)
        type: boolean
        default: false
      env_personal:
        description: Environment personal
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release_id: ${{ steps.release.outputs.release_id }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
          BUILD_WEB: ${{ inputs.build_web }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          ENV_PERSONAL: ${{ inputs.env_personal }}
        run: |
          version=$(node scripts/bump-version.mjs "$BUMP" --dry-run)

          platforms=()
          [ "$BUILD_WEB" = true ] && platforms+=(web)
          [ "$BUILD_WINDOWS" = true ] && platforms+=(windows)
          [ "$BUILD_MACOS" = true ] && platforms+=(macos)
          [ "$BUILD_LINUX" = true ] && platforms+=(linux)
          [ "$BUILD_ANDROID" = true ] && platforms+=(android)

          environments=()
          [ "$ENV_PERSONAL" = true ] && environments+=(personal)

          if [ ${#platforms[@]} -eq 0 ] || [ ${#environments[@]} -eq 0 ]; then
            echo "::error::Tick at least one version to build and one environment."
            exit 1
          fi

          to_json() { printf '%s\n' "$@" | jq -R . | jq -cs .; }

          matrix=$(jq -cn \
            --argjson environments "$(to_json "${environments[@]}")" \
            --argjson platforms "$(to_json "${platforms[@]}")" '
              {
                web:     { os: "ubuntu-latest",  rust_targets: "",  args: "" },
                windows: { os: "windows-latest", rust_targets: "",  args: "" },
                macos:   { os: "macos-latest",   rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin", args: "--target universal-apple-darwin" },
                linux:   { os: "ubuntu-latest",  rust_targets: "",  args: "" },
                android: { os: "ubuntu-latest",  rust_targets: "aarch64-linux-android", args: "" }
              } as $spec
              | { include: [ $environments[] as $e | $platforms[] as $p
                  | { environment: $e, platform: $p } + $spec[$p] ] }')

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Next version: $version" >> "$GITHUB_STEP_SUMMARY"

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/bump-version.mjs "$BUMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          sha=$(git rev-parse HEAD)
          gh release create "v$VERSION" --target "$sha" --title "Alavo Daily v$VERSION" --generate-notes
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.environment }})
    needs: plan
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: ./.github/actions/setup
        with:
          rust-targets: ${{ matrix.rust_targets }}

      - name: Build web
        if: matrix.platform == 'web'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          ENVIRONMENT: ${{ matrix.environment }}
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          pnpm --filter @alavo-daily/web build
          zip="alavo-daily-web-$ENVIRONMENT-$VERSION.zip"
          (cd apps/web/dist && zip -qr "$GITHUB_WORKSPACE/$zip" .)
          gh api --method POST             "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$zip"             -H "Content-Type: application/zip"             --input "$zip"

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Build desktop
        if: matrix.platform != 'web' && matrix.platform != 'android'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALAVO_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.ALAVO_GOOGLE_DESKTOP_CLIENT_ID }}
          ALAVO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ALAVO_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          projectPath: apps/native
          tauriScript: pnpm tauri
          releaseId: ${{ needs.plan.outputs.release_id }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: '[name]-${{ matrix.environment }}-[version]-[platform]-[arch][setup][ext]'
          uploadWorkflowArtifacts: false
          uploadUpdaterSignatures: false

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        if: matrix.platform == 'android'
        shell: bash
        working-directory: apps/native
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          NDK_HOME="$ANDROID_NDK_HOME" pnpm tauri android init --ci

      - name: Apply the app icon and allow exact reminder alarms on Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          node scripts/patch-android-manifest.mjs apps/native/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          node scripts/apply-android-icons.mjs
          grep -n "uses-permission" apps/native/src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android
        if: matrix.platform == 'android'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          ENVIRONMENT: ${{ matrix.environment }}
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          ALAVO_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.ALAVO_GOOGLE_DESKTOP_CLIENT_ID }}
          ALAVO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ALAVO_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          cd apps/native
          pnpm tauri android build --apk --target aarch64

          apk=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::The Android build produced no unsigned APK."
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            echo "::warning::The Android keystore or its password secret is missing. Signing with a throwaway key: the APK installs, but cannot update an APK signed by another build."
            KEYSTORE_PASSWORD=android-throwaway
            KEY_ALIAS=throwaway
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Alavo Daily"
          fi

          export KEYSTORE_PASSWORD
          "$build_tools/zipalign" -p -f 4 "$apk" aligned.apk
          "$build_tools/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --out signed.apk aligned.apk

          name="alavo-daily-android-$ENVIRONMENT-$VERSION.apk"
          mv signed.apk "$name"
          gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --input "$name"
