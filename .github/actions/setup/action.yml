name: Set up workspace
description: Install pnpm, Node, Rust and wasm-pack, install dependencies and build the engine WASM.

inputs:
  rust-targets:
    description: Extra Rust targets, comma separated.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets == '' && 'wasm32-unknown-unknown' || format('wasm32-unknown-unknown,{0}', inputs.rust-targets) }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          packages/engine
          apps/native/src-tauri

    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm build:wasm
      shell: bash
