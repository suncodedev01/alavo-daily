[package]
name = "alavo-daily-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "alavo_daily_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde_json = "1"
alavo-domain = { path = "../../../packages/engine/domain" }
alavo-presentation = { path = "../../../packages/engine/presentation" }
alavo-infrastructure = { path = "../../../packages/engine/infrastructure", features = ["native"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
ureq = "3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

# Not part of the engine workspace: the native app has its own lockfile and target directory.
[workspace]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
